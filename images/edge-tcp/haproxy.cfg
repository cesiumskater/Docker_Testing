# The edge's TCP side (README, "The HTTPS front door"): ports 2456 and 28192,
# passed through byte for byte. Fishbowl Server isn't on a network the LAN can
# reach, so this is the only way in to it.
#
#   2456   Fishbowl Clients and the REST API. Straight to Fishbowl Server, or, when
#          FB_CLIENT_TLS=edge, to the Caddy edge, which terminates TLS first.
#   28192  Fishbowl's legacy API, for integrated apps: always straight through.

global
    log stdout format iso local0 info
    # Nothing manages HAProxy while it runs: no stats socket, no master CLI.

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    timeout connect 5s
    # Fishbowl Clients and integrated apps hold connections open for hours.
    timeout client 24h
    timeout server 24h
    option clitcpka
    option srvtcpka

# Docker's own DNS: containers get a new address when they're recreated, so the
# names are looked up again every 10 seconds instead of once at start.
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s
    hold other 10s
    hold refused 10s
    hold nx 10s
    hold timeout 10s

frontend health
    mode http
    bind 127.0.0.1:8405
    no log
    monitor-uri /healthz

frontend fishbowl_clients
    bind :2456
    default_backend clients

frontend fishbowl_legacy_api
    bind :28192
    default_backend legacy_api

backend clients
.if streq("$FB_CLIENT_TLS",edge)
    server edge edge:2456 resolvers docker init-addr last,libc,none
.else
    server fishbowl fishbowl:2456 resolvers docker init-addr last,libc,none
.endif

backend legacy_api
    server fishbowl fishbowl:28192 resolvers docker init-addr last,libc,none
