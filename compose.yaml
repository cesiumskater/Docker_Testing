# Fishbowl Advanced in Docker, with Docker Compose. See README.md.
#
#   Start (builds the image from GitHub the first time):
#       docker compose up -d
#   Then open the Fishbowl page. Its link, with the access code:
#       docker exec fishbowl fishbowl-link
#   After the installer on GitHub changes (a new Fishbowl version):
#       docker compose build
#       docker compose up -d
#     The page then offers the upgrade; nothing changes until you accept it there.
#
# Run these in the folder that holds this file. They're the same on Linux,
# macOS and Windows (PowerShell).
#
# `restart: always` starts the container whenever Docker starts, even if it was
# stopped by hand before. Docker itself has to start with the computer (README,
# "Starting automatically"). Volume names are fixed so `docker run` and Compose
# share the same data.
name: fishbowl

services:
  fishbowl:
    # The image is built from the GitHub repository, which also downloads the
    # Fishbowl installer from the repository's release. `pull_policy: never`
    # means Compose builds it when it's missing instead of looking on Docker Hub.
    image: fishbowl
    pull_policy: never
    build: https://github.com/cesiumskater/Docker_Testing.git#main
    # The image is x86-64. On a Mac with Apple Silicon this has Docker build
    # and run it under emulation; on an x86-64 computer it changes nothing.
    platform: linux/amd64
    container_name: fishbowl
    restart: always
    # Fishbowl Server and MySQL need time to shut down cleanly.
    stop_grace_period: 3m
    ports:
      - "2456:2456"            # Fishbowl Clients connect here
      - "127.0.0.1:6080:6080"  # the Fishbowl page; this computer only
    volumes:
      - fishbowl-mysql:/var/lib/mysql
      - fishbowl-app:/opt/Fishbowl
      - fishbowl-data:/var/lib/fishbowl
    environment:
      TZ: UTC  # your time zone, for example America/Denver

volumes:
  fishbowl-mysql:
    name: fishbowl-mysql
  fishbowl-app:
    name: fishbowl-app
  fishbowl-data:
    name: fishbowl-data
