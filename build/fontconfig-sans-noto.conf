<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The Compose stack's server and desktop images: Noto Sans first for sans-serif,
  as Fedora gives the single container. Java's SansSerif and Dialog fonts come
  from here, so Server Administration, the Fishbowl Client and the reports that
  ask for SansSerif or Arial look the same in both. (Without it, Enterprise
  Linux 9 picks DejaVu Sans, which is wider: windows grow and text moves.)
-->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
    </prefer>
  </alias>
</fontconfig>
